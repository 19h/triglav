name: Validate multi-uplink exit
on: [push, pull_request, workflow_dispatch]
jobs:
  production-network:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: bash validation/run.sh "$PWD/validation/artifacts/ci"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: triglav-validation
          path: validation/artifacts/ci
